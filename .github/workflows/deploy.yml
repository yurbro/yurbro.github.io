name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Validate SEO metadata and public pages
        run: |
          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          class MetadataParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}
                  self.ld = []
                  self.in_ld = False
                  self.buffer = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "meta":
                      key = attrs.get("property") or attrs.get("name")
                      if key:
                          self.meta[key] = attrs.get("content", "")
                  if tag == "script" and attrs.get("type") == "application/ld+json":
                      self.in_ld = True
                      self.buffer = []

              def handle_data(self, data):
                  if self.in_ld:
                      self.buffer.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_ld:
                      self.ld.append(json.loads("".join(self.buffer)))
                      self.in_ld = False

          checked = ["", "publications", "cv", "projects", "activities", "beyond", "teaching"]
          root = Path("_site")
          for route in checked:
              filename = root / route / "index.html"
              parser = MetadataParser()
              parser.feed(filename.read_text(encoding="utf-8"))
              image = parser.meta.get("og:image", "")
              assert image.startswith("https://yurbro.github.io/assets/img/"), (route, image)
              relative = image.removeprefix("https://yurbro.github.io/")
              assert (root / relative).is_file(), (route, "missing OG image", image)
              assert parser.meta.get("twitter:image") == image, route
              assert parser.ld, (route, "missing JSON-LD")
              graph = parser.ld[0].get("@graph", [])
              types = {node.get("@type") for node in graph}
              assert {"Person", "WebSite", "WebPage"} <= types, (route, types)
              if not route:
                  person = next(node for node in graph if node["@type"] == "Person")
                  assert len(person.get("sameAs", [])) >= 4, "Homepage is missing public academic identity links"

          for route in ("blog", "books", "archive", "books/the_godfather"):
              assert not (root / route / "index.html").exists(), (route, "sample page still deployed")
          print("Validated metadata and disabled demo pages across", len(checked), "routes")

          class PictureParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.pictures = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "picture":
                      self.current = {"source": [], "img": []}
                  elif self.current is not None and tag in ("source", "img"):
                      self.current[tag].append(attrs)

              def handle_endtag(self, tag):
                  if tag == "picture" and self.current is not None:
                      self.pictures.append(self.current)
                      self.current = None

          for route, minimum_pictures in (("activities", 18), ("beyond", 1), ("", 1)):
              content = (root / route / "index.html").read_text(encoding="utf-8")
              picture_parser = PictureParser()
              picture_parser.feed(content)
              if route == "activities":
                  photos = [pic for pic in picture_parser.pictures if pic["img"] and "/assets/img/activities/" in pic["img"][0].get("src", "")]
              elif route == "beyond":
                  photos = [pic for pic in picture_parser.pictures if pic["img"] and "chisa-2026-09-prague" in pic["img"][0].get("src", "")]
              else:
                  photos = [pic for pic in picture_parser.pictures if pic["img"] and "/assets/img/prof_pic.jpg" in pic["img"][0].get("src", "")]
              assert len(photos) >= minimum_pictures, (route, "missing responsive pictures", len(photos))
              for photo in photos:
                  image = photo["img"][0]
                  assert int(image.get("width", 0)) > 0 and int(image.get("height", 0)) > 0, (route, image)
                  assert image.get("loading") in ("lazy", "eager"), (route, image)
                  webp_sources = [entry for entry in photo["source"] if entry.get("type") == "image/webp"]
                  assert webp_sources, (route, "missing responsive WebP source", image)
                  for source in webp_sources:
                      assert source.get("sizes"), (route, "missing responsive sizes")
                      paths = [candidate.strip().split()[0] for candidate in source["srcset"].split(",") if candidate.strip()]
                      assert len(paths) >= 3, (route, "incomplete WebP resolutions", paths)
                      for webp_path in paths:
                          assert (root / webp_path.lstrip("/")).is_file(), (route, "missing generated WebP", webp_path)
          print("Validated 18+ gallery photos, Beyond photo and profile WebP sources")
          PY
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
