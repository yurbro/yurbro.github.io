name: Sync visitor statistics

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visitor-statistics
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recorded widget loads
        env:
          MAPMYVISITORS_ENDPOINT: https://mapmyvisitors.com/ajax/orange_dots?id=2249417&last_hit_id=0&max_hit_id=0&max_visit_count=1
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            "$MAPMYVISITORS_ENDPOINT" -o /tmp/mapmyvisitors.json

          total="$(jq -er '.visits_count | tonumber | if . >= 0 and floor == . then . else error("Invalid visit count") end' /tmp/mapmyvisitors.json)"

          jq -n \
            --argjson total "$total" \
            --arg updated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{total_visits: $total, updated_at: $updated_at, source: "MapMyVisitors", metric: "recorded_widget_loads"}' \
            > /tmp/visitor-stats.json

      - name: Check out statistics branch
        uses: actions/checkout@v4
        with:
          ref: visitor-stats
          path: visitor-data
          fetch-depth: 1

      - name: Validate and publish aggregate statistics
        run: |
          set -euo pipefail

          current_total="$(jq -r '.total_visits | tonumber' /tmp/visitor-stats.json)"
          previous_total="$(jq -r '.total_visits | tonumber' visitor-data/visitor-stats.json)"

          if (( current_total < previous_total )); then
            echo "::error::MapMyVisitors returned a lower cumulative count. Refusing to publish a potentially incomplete counter."
            exit 1
          fi

          # Refresh the snapshot timestamp at least every 6 hours even if the count is unchanged.
          # This avoids an indefinitely stale timestamp without committing hourly.
          if (( current_total == previous_total )); then
            last_updated="$(jq -r '.updated_at // ""' visitor-data/visitor-stats.json)"
            previous_epoch="$(date -u -d "$last_updated" +%s 2>/dev/null || echo 0)"
            now_epoch="$(date -u +%s)"
            age_seconds="$((now_epoch - previous_epoch))"

            if (( age_seconds >= 0 && age_seconds < 21600 )); then
              echo "Count unchanged; a successful snapshot was published within 6 hours."
              exit 0
            fi
          fi

          cp /tmp/visitor-stats.json visitor-data/visitor-stats.json
          cd visitor-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitor-stats.json
          git commit -m "Update recorded visitor widget loads"
          git push origin HEAD:visitor-stats
