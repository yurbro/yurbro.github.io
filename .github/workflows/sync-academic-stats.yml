name: Sync academic statistics

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: academic-statistics
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publications
        uses: actions/checkout@v4

      - name: Collect DOI-level OpenAlex metrics
        env:
          OPENALEX_API: https://api.openalex.org
          OPENALEX_MAILTO: yu.zhang@surrey.ac.uk
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          bibliography = Path("_bibliography/papers.bib").read_text()
          dois = list(dict.fromkeys(re.findall(r"doi\s*=\s*[\{\"]([^}\"]+)", bibliography, flags=re.IGNORECASE)))

          if not dois:
              raise ValueError("No DOI entries found in the bibliography")

          works = []
          missing = []
          api = os.environ["OPENALEX_API"].rstrip("/")
          mailto = urllib.parse.quote(os.environ["OPENALEX_MAILTO"])

          for doi in dois:
              work_id = urllib.parse.quote(f"https://doi.org/{doi}", safe="")
              url = f"{api}/works/{work_id}?mailto={mailto}"
              request = urllib.request.Request(url, headers={"User-Agent": "Yu Zhang academic website metrics"})

              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          works.append(json.load(response))
                      break
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          missing.append(doi)
                          break
                      if attempt == 2:
                          raise
                  except (TimeoutError, urllib.error.URLError):
                      if attempt == 2:
                          raise
                  time.sleep(2**attempt)

          minimum_coverage = max(1, len(dois) - 2)
          if len(works) < minimum_coverage:
              raise RuntimeError(f"OpenAlex coverage unexpectedly fell to {len(works)}/{len(dois)}")

          citation_counts = sorted((int(work.get("cited_by_count", 0)) for work in works), reverse=True)
          h_index = sum(count >= rank for rank, count in enumerate(citation_counts, start=1))

          metrics = {
              "citations": sum(citation_counts),
              "h_index": h_index,
              "open_access_works": sum(bool(work.get("open_access", {}).get("is_oa")) for work in works),
              "indexed_works": len(works),
              "listed_works": len(dois),
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source": "OpenAlex",
              "source_url": "https://openalex.org",
          }

          Path("/tmp/academic-stats.json").write_text(json.dumps(metrics, indent=2) + "\n")
          print(f"Indexed {len(works)}/{len(dois)} DOI-linked works; missing: {', '.join(missing) or 'none'}")
          PY

      - name: Check out statistics branch
        uses: actions/checkout@v4
        with:
          ref: academic-stats
          path: academic-data
          fetch-depth: 1

      - name: Publish aggregate academic statistics
        run: |
          set -euo pipefail
          cp /tmp/academic-stats.json academic-data/academic-stats.json
          cd academic-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academic-stats.json

          if git diff --cached --quiet; then
            echo "Academic statistics have not changed."
            exit 0
          fi

          git commit -m "Update aggregate academic statistics"
          git push origin HEAD:academic-stats
