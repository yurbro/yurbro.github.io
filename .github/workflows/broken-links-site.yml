name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  check-links-on-site:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      # The CV PDF is generated only in Deploy site, not by a plain Jekyll build.
      # Import the deployed PDF before checking local links to avoid a false 404.
      - name: Include generated academic CV PDF in link checks
        run: |
          set -euo pipefail
          if grep -q 'Yu_Zhang_Academic_CV.pdf' _site/cv/index.html; then
            mkdir -p _site/assets/pdf
            git fetch --no-tags --depth=1 origin gh-pages
            git show FETCH_HEAD:assets/pdf/Yu_Zhang_Academic_CV.pdf > _site/assets/pdf/Yu_Zhang_Academic_CV.pdf
            test -s _site/assets/pdf/Yu_Zhang_Academic_CV.pdf
          fi
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # only check local links
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --verbose --no-progress '_site/**/*.html'
